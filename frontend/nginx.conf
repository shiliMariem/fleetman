server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Récupération des véhicules et de leurs positions
    location /api/vehicles/ {
        proxy_pass http://position-tracker:8080/vehicles/;
    }

    # Historique des trajets
    location /api/history/ {
        proxy_pass http://fleetman-api-gateway:8080/history/;
    }

    # Communication en temps réel via WebSocket
    location /api/updates {
        proxy_pass http://fleetman-api-gateway:8080/updates;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

